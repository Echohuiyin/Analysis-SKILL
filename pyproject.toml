[project]
name = "kernel-analysis-skill"
version = "0.1.0"
description = "Kernel analysis skills collection with MCP-powered vmcore and lock analysis"
readme = "README.md"
license = {text = "GPL-2.0-only"}
authors = [{name = "Kernel Analysis Team"}]
keywords = ["linux", "kernel", "crash", "vmcore", "lock", "debugging", "ai", "mcp", "claude-code"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Operating System Kernels :: Linux",
    "Topic :: Software Development :: Debuggers",
]
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "mcp[cli]>=1.0.0",
    "openai>=1.0.0",
    "pexpect",
    "pydantic>=2.0.0",
    "python-dotenv",
    "tenacity"
]

[project.optional-dependencies]
cli = ["typer[all]", "rich"]

[project.scripts]
aicrasher-mcp = "aicrasher.mcp_server:main"

[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]